name: Daily check for new Sphinx dockers to build against.

on:
  schedule:
    # Runs at midnight UTC every day.
    - cron:  '0 0 * * 5'
  workflow_dispatch:

jobs:
  run-shell-script: linux_arm86
    steps:
      - uses: actions/checkout@v2.0.2
      - name: Run a shell script
        run: |
          ./bin/tryrelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

